pcm.dptx_out {
    type hooks
    slave.pcm {
        type plug
        slave {
            pcm "hw:mt8391evk,5,0"
            channels 2
        }
    }
    hooks.0 {
        type ctl_elems
        hook_args [
            {
                name "HDMI_CH0_MUX"
                preserve true
                value "CH0"
            }
            {
                name "HDMI_CH1_MUX"
                preserve true
                value "CH1"
            }
            {
                name "DPTX_OUT_MUX"
                preserve true
                value "Connect"
            }
        ]
    }
}

pcm.line {
    type asym
    playback.pcm "earphone_speaker"
    capture.pcm "earphone_mic"
}

pcm.builtin {
    type asym
    playback.pcm "builtin_speaker"
    capture.pcm "builtin_mic"
}

pcm.!sysdefault {
    @args [ CARD ]
    @args.CARD { type string }
    type empty
    slave.pcm "builtin"
    hint {
        description "Default Audio Device"
    }
}

pcm.!default pcm.sysdefault
