}

pcm.earphone_mic {
    type hooks
    slave.pcm {
        type plug
        slave {
            pcm "hw:mt8391evk,4,0"
            channels 1
        }
    }
    hooks.0 {
        type ctl_elems
        hook_args [
            {
                name "Headset_Mic_Switch"
                preserve true
                value "Headset Mic"
            }
            {
                name "UL2_CH1 ADDA_UL_CH1"
                preserve true
                value true
            }
            {
                name "MISO0_MUX"
                preserve true
                value "UL1_CH1"
            }
            {
                name "ADC_L_Mux"
                preserve true
                value "Left Preamplifier"
            }
            {
                name "PGA_L_Mux"
                preserve true
                value "AIN1"
            }
        ]
    }
}

